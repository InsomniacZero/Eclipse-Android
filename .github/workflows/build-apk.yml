name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Eclipse Android Client
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK for Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Eclipse-Client-v1.0.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-apk
          name: "Eclipse Android Client v1.0.0"
          body: |
            ### Eclipse Android Client (Path B All-in-One Client)
            - **Gateway**: Embedded Python Chaquopy backend running on `http://127.0.0.1:5000`
            - **Janitor AI Tab**: Resident dual-tab WebView with Chrome Private Network Access bypass
            - **Authentication**: Native system browser delegation for Google, Discord, GitHub, and Apple OAuth
            - **Background Operation**: Android 14 API 34 Foreground Service with `specialUse` type
          files: Eclipse-Client-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
