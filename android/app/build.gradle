plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.eclipse.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.eclipse.ai"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }

        python {
            version "3.10"
            pip {
                install "starlette>=0.27.0"
                install "uvicorn>=0.30.0"
                install "httpx>=0.27.0"
                install "websockets>=12.0"
            }
            extractPackages "eclipse"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

tasks.register('syncEclipsePackage', Sync) {
    description = 'Syncs Eclipse python backend source into Chaquopy python directory'
    from("${rootDir}/../eclipse") {
        exclude "**/.venv/**"
        exclude "**/__pycache__/**"
        exclude "**/*.pyc"
        exclude "**/data/**"
        exclude "**/.git/**"
    }
    into("${projectDir}/src/main/python/eclipse")
}

preBuild.dependsOn syncEclipsePackage

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
}
